name: Task
description: A piece of work to do
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What does "done" look like?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      value: |
        - [ ]
        - [ ]
  - type: textarea
    id: related
    attributes:
      label: Related files, requirements, or issues
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Fill in when done - what was decided or produced, with links.
